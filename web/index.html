<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PortfoyApp - Kişisel Finans ve Portföy Takip Uygulaması">

  <!-- Cache Önleme Meta Etiketleri -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS & Android PWA Meta Etiketleri -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PortfoyApp">
  <meta name="theme-color" content="#0A1128">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>PortfoyApp</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A1128;
      color: #F9FAFB;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <script>
    // ------------------------------------------------------------------------
    // FLUTTER BUILDCONFIG INTERCEPTOR (MAIN.DART.JS CACHE-BUSTING)
    // ------------------------------------------------------------------------
    window._flutter = window._flutter || {};
    (function() {
      let _realBuildConfig = null;
      Object.defineProperty(window._flutter, 'buildConfig', {
        get: function() { return _realBuildConfig; },
        set: function(val) {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            const activeV = urlParams.get('_v') || localStorage.getItem('app_installed_version') || Date.now().toString();
            if (val && Array.isArray(val.builds)) {
              val.builds.forEach(function(b) {
                if (b && b.mainJsPath && !b.mainJsPath.includes('?v=')) {
                  b.mainJsPath = b.mainJsPath + '?v=' + encodeURIComponent(activeV);
                }
              });
            }
          } catch (_) {}
          _realBuildConfig = val;
        },
        configurable: true,
        enumerable: true
      });
    })();

    // ------------------------------------------------------------------------
    // ÖNBELLEK VE SERVICE WORKER TEMİZLEME YARDIMCILARI
    // ------------------------------------------------------------------------
    async function clearAllClientCaches() {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
          console.log('[AutoUpdate] CacheStorage temizlendi.');
        }
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
          console.log('[AutoUpdate] Service Worker kaldırıldı.');
        }
      } catch (err) {
        console.warn('[AutoUpdate] Önbellek silme hatası:', err);
      }
    }

    // ------------------------------------------------------------------------
    // OTOMATİK SESSİZ GÜNCELLEME & ÖNBELLEK TEMİZLEME (NO POPUP HARD CACHE CLEAR)
    // ------------------------------------------------------------------------
    async function checkAppVersionAndHardClearCache() {
      try {
        const response = await fetch('version.json?_t=' + Date.now(), {
          cache: 'no-store',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache'
          }
        });

        if (response.ok) {
          const info = await response.json();
          const serverVersion = (info.version || info.build_time || '').trim();
          const cachedVersion = (localStorage.getItem('app_installed_version') || '').trim();

          if (serverVersion && cachedVersion && cachedVersion !== serverVersion) {
            const lastReloaded = sessionStorage.getItem('last_reloaded_version');
            if (lastReloaded === serverVersion) {
              return;
            }
            console.log('[AutoUpdate] Yeni sürüm tespit edildi:', serverVersion, '(Mevcut:', cachedVersion, ') - Önbellek temizleniyor...');
            await clearAllClientCaches();
            localStorage.setItem('app_installed_version', serverVersion);
            sessionStorage.setItem('last_reloaded_version', serverVersion);

            if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
              window.chrome.webview.postMessage('clear_cache_and_reload');
              return;
            }

            const url = new URL(window.location.href);
            url.searchParams.set('_v', serverVersion);
            url.searchParams.set('_t', Date.now().toString());
            window.location.replace(url.toString());
            return;
          } else if (serverVersion && !cachedVersion) {
            localStorage.setItem('app_installed_version', serverVersion);
          }
        }
      } catch (e) {
        console.warn('[AutoUpdate] Versiyon kontrol uyarısı:', e);
      }
    }

    // Yeni Service Worker kontrolü devraldığında otomatik güncelle
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!window._swReloaded) {
          window._swReloaded = true;
          window.location.reload();
        }
      });
    }

    // ------------------------------------------------------------------------
    // MANUEL GÜNCELLEME VE ÖNBELLEK TEMİZLEYEREK YENİLEME (DART ÇAĞRISI)
    // ------------------------------------------------------------------------
    window.performHardAppUpdate = async function(targetVersion) {
      console.log('[AppUpdate] Manuel güncelleme başlatıldı. Hedef:', targetVersion);

      const v = (targetVersion || '').trim() || Date.now().toString();

      try {
        localStorage.setItem('app_installed_version', v);
        sessionStorage.removeItem('last_reloaded_version');
      } catch (_) {}

      // 1. Desktop WebView2 desteği (varsa yerel disk/bellek önbelleğini temizlet)
      try {
        if (window.chrome && window.chrome.webview && typeof window.chrome.webview.postMessage === 'function') {
          window.chrome.webview.postMessage('clear_cache_and_reload');
          return;
        }
      } catch (e) {
        console.warn('[AppUpdate] WebView2 mesaj hatası:', e);
      }

      // 2. Tarayıcı önbelleklerini temizle
      await clearAllClientCaches();

      // 3. Sert URL yenilemesi
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('_v', v);
        url.searchParams.set('_t', Date.now().toString());
        window.location.replace(url.toString());
      } catch (e) {
        window.location.reload(true);
      }
    };
  </script>
</head>
<body>
  <script>
    (async function() {
      let activeVersion = '';
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const queryV = urlParams.get('_v');
        if (queryV) {
          activeVersion = queryV.trim();
          localStorage.setItem('app_installed_version', activeVersion);
        } else {
          // version.json dosyasını no-cache olarak hızlıca sorgula
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 2000);
          const res = await fetch('version.json?_t=' + Date.now(), {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            },
            signal: ctrl.signal
          });
          clearTimeout(timer);
          if (res.ok) {
            const data = await res.json();
            const serverVersion = (data.version || data.build_time || '').trim();
            const cachedVersion = (localStorage.getItem('app_installed_version') || '').trim();
            if (serverVersion) {
              if (cachedVersion && cachedVersion !== serverVersion) {
                console.log('[Bootstrap] Yeni sürüm (' + serverVersion + ') tespit edildi. Önbellek siliniyor...');
                await clearAllClientCaches();
              }
              activeVersion = serverVersion;
              localStorage.setItem('app_installed_version', serverVersion);
            }
          }
        }
      } catch (e) {
        console.warn('[Bootstrap] Versiyon sorgulama uyarısı:', e);
      }

      if (!activeVersion) {
        activeVersion = localStorage.getItem('app_installed_version') || Date.now().toString();
      }

      // flutter_bootstrap.js dosyasını versiyon query parametresiyle dinamik ekle
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(activeVersion);
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
